# The voice server behind Caddy, which gets the HTTPS certificate for PUBLIC_HOST_NAME
# and passes the media WebSocket through. Run on the server with: sudo docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST_NAME: ${PUBLIC_HOST_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
